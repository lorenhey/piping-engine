[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piping-engine"
version = "0.1.0"
description = "Motor de cálculo hidráulico y termofluido de código abierto para sistemas de tuberías."
authors = [{ name = "Ingeniería", email = "ingenieria@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pint>=0.22",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "coolprop>=6.4.3",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
gui = [
    "PySide6>=6.5.0",
]

[project.scripts]
piping-engine = "piping_engine.cli:app"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=piping_engine"
testpaths = [
    "tests",
]
